name: Reproducibility checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_replay:
        description: "Run all 830 optimization calls and additional sensitivity experiments"
        type: boolean
        default: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact archive snapshot
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify input hashes, rebuild inputs and test selected solutions
        run: python reproduce.py --quick
      - name: Replay complete analysis and compare frozen tables
        if: github.event_name == 'workflow_dispatch' && inputs.full_replay
        run: python reproduce.py --full
